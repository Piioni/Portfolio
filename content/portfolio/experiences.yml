items:
  - id: sipay-sipos
    company: Sipay (Sipos)
    role: Junior Developer
    startDate: 2026-05
    description: Part of the team building Sipos v4, Sipay's new hospitality management software, built from scratch. A POS for waiters (Android, iOS and web) and a web Backoffice for managers, for restaurants and delivery, with support for groups and chains.
    highlights:
      - Implemented the Backoffice catalog, the core of the product, with product creation by formats and rates, cost breakdown and allergens, menus, modifiers and consumption points, which define the data the POS uses to create orders.
      - Implemented the new POS access, with a personal code per employee instead of picking a profile as in v3, so every action on the terminal, including payments and cash, is attributed to a person. Includes venue selection, session lock and the app shell, on tablet and mobile.
      - Implemented in Flutter the design system shared by the POS and the Backoffice, from Figma, with TDD, golden tests and CI, so both apps share the same components.
    technologies:
      - id: flutter
        label: Flutter
      - id: dart
        label: Dart
      - id: figma
        label: Figma

  - id: wegow-music
    company: Wegow Music
    role: Multiplatform Developer (Intern)
    startDate: 2026-02
    endDate: 2026-05
    description: Led the migration of a legacy Android application written in Kotlin to Kotlin Multiplatform and Compose.
    highlights:
      - Defined the technical strategy and reorganized the architecture, separating responsibilities and modularizing the project.
      - Shared business logic across platforms and reused UI with Compose where it made sense.
      - Resolved platform differences in navigation, state and persistence.
    technologies:
      - id: kotlin-multiplatform
        label: Kotlin Multiplatform
      - id: kotlin-compose
        label: Kotlin Compose
      - id: ios
        label: iOS

  - id: pegasus-medical
    company: Pegasus Medical
    role: Fullstack Developer (Intern)
    startDate: 2025-05
    endDate: 2025-06
    description: Designed and developed a PHP/MySQL web application to centralize the tracking of medical supplies across several hospitals.
    highlights:
      - Stock per warehouse and first-aid kit, with transfers, entries, returns and restocks that go through pending, completed and cancelled states.
      - Four roles with access limited by hospital and floor, on plain PHP 8.2 with an MVC architecture and service and repository layers.
      - Containerized the application and the database with Docker to keep environments consistent.
    technologies:
      - id: php
        label: PHP
      - id: docker
        label: Docker
      - id: mysql
        label: MySQL
      - id: html
        label: HTML
      - id: css
        label: CSS
      - id: javascript
        label: JavaScript
